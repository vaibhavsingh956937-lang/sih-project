<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AYUSH OPD Patient Case System</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container auth-wrapper">
    <div class="card auth-card">
      <div class="auth-header">
        <div class="brand-logo" style="margin: 10px auto 14px; width: 56px; height: 56px; font-size: 26px; border-radius: 16px;">🌿</div>
        <h1>AYUSH OPD System</h1>
        <p>National Integrated Patient Case Management Portal</p>
      </div>

      <div id="alert-container"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Doctor Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="doctor@ayush.gov.in" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-block" style="padding: 13px; font-size: 15px;">
          Login to OPD Dashboard →
        </button>
      </form>

      <!-- Quick Demo Login Credentials Card -->
      <div style="margin-top: 24px; padding-top: 18px; border-top: 1px dashed var(--border);">
        <div style="font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; text-align: center; letter-spacing: 0.5px;">
          🔑 Quick Demo Accounts
        </div>
        <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary" style="padding: 7px 14px; font-size: 12px; border-radius: var(--radius-pill);" onclick="fillDemo('doctor1@ayush.gov.in', 'doctor1234')">
            🌿 Dr. Asha (Ayurveda)
          </button>
          <button type="button" class="btn btn-secondary" style="padding: 7px 14px; font-size: 12px; border-radius: var(--radius-pill);" onclick="fillDemo('doctor2@ayush.gov.in', 'doctor1234')">
            🧘 Dr. Raj (Yoga)
          </button>
        </div>
      </div>

      <div style="margin-top: 20px; text-align: center; font-size: 13px; color: var(--text-secondary);">
        Don't have a doctor account? <a href="register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create Account</a>
      </div>
    </div>
  </div>

  <footer>
    AYUSH OPD Patient Case Management System &copy; 2026. Self-Hosted & Secure.
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');
      const alertContainer = document.getElementById('alert-container');

      alertContainer.innerHTML = '';
      btn.disabled = true;
      btn.innerText = 'Authenticating...';

      try {
        const res = await API.auth.login({ email, password });
        localStorage.setItem('ayush_token', res.token);
        localStorage.setItem('ayush_doctor', JSON.stringify(res.doctor));
        App.showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 400);
      } catch (err) {
        alertContainer.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
        btn.disabled = false;
        btn.innerText = 'Login to OPD Dashboard →';
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('session') === 'expired') {
      document.getElementById('alert-container').innerHTML = '<div class="alert alert-error">Your session expired. Please log in again.</div>';
    }
  </script>
</body>
</html>
